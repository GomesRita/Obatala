name: Testes Unitários

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------
  # PHPUnit — testes unitários puros (sem WordPress a correr)
  # ---------------------------------------------------------------
  php-tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências PHP
        run: composer install --prefer-dist --no-progress

      - name: Criar pasta de relatórios
        run: mkdir -p reports

      - name: Correr PHPUnit com relatório JUnit + cobertura
        run: |
          vendor/bin/phpunit \
            --log-junit reports/phpunit-junit.xml \
            

      - name: Diagnóstico — listar conteúdo de reports/
        if: always()
        run: ls -la reports/ || echo "pasta reports/ não existe ou está vazia"

      - name: Resumo no Job Summary
        if: always()
        run: |
          echo "### Resultado PHPUnit" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/phpunit-junit.xml ]; then
            php -r '
              $x = simplexml_load_file("reports/phpunit-junit.xml");
              $t = $x->testsuite ?? $x;
              echo "- Testes: " . (string)$t["tests"] . "\n";
              echo "- Falhas: " . (string)$t["failures"] . "\n";
              echo "- Erros: " . (string)$t["errors"] . "\n";
              echo "- Tempo: " . (string)$t["time"] . "s\n";
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar artefactos PHPUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-reports
          path: reports/
          retention-days: 30

      - name: Publicar resultados como Check Run
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados PHPUnit
          path: reports/phpunit-junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Comentar no PR com o resumo
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/phpunit-junit.xml
          comment_mode: always
